# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions
# 

name: Node.js CI

on:
  pull_request:
  workflow_dispatch:

env:
  API_URL: "https://pl-maciejkopec-cms.azurewebsites.net"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wait on
        uses: iFaxity/wait-on-action@v1
        with:
          resource: ${{ env.API_URL }}/actuator/health
          timeout: 300000
          interval: 10000
          verbose: true
      - name: Ensure .cache directory exists
        run: mkdir -p .cache
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          build: yarn build
          start: yarn serve --host 127.0.0.1 --port 8000
          wait-on: >-
            curl --fail --silent --show-error --noproxy 127.0.0.1
            --retry 150 --retry-delay 1 --retry-connrefused --retry-max-time 150
            --max-time 5 --output /dev/null http://127.0.0.1:8000/
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:8000
          API_KEY: ${{ secrets.API_KEY }}
          GATSBY_API_URL: ${{ env.API_URL }}
